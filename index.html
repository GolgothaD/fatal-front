<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fatal Front</title><meta name="theme-color" content="#120404">
<meta name="description" content="Fatal Front — an original mid-90s arcade mash-up: run-and-gun stages that end in one-on-one fighting duels.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta property="og:title" content="Fatal Front"><meta property="og:image" content="icons/icon-512.png">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#view{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#touch{display:none;position:absolute;left:0;right:0;top:0;pointer-events:none}
body.hastouch #touch{display:block}
#stickzone{position:absolute;pointer-events:auto;touch-action:none}
#stickbase,#knob{position:absolute;border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
#stickbase{border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06)}#knob{width:54px;height:54px;background:rgba(255,80,40,.55);border:2px solid rgba(255,220,180,.7)}
#stickbase.on,#knob.on{opacity:1}#stickzone::after{content:'\2725  MOVE';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.22);font:700 13px system-ui,sans-serif;letter-spacing:3px;white-space:nowrap;pointer-events:none}
.btn{position:absolute;pointer-events:auto;border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;font:bold 20px/1 system-ui,sans-serif;color:#fff;border:2px solid rgba(255,255,255,.5);touch-action:none;text-shadow:0 1px 2px #000}
.btn.on{filter:brightness(1.6);transform:scale(.94)}
.btn[data-k=a]{background:rgba(40,170,60,.55)}.btn[data-k=x]{background:rgba(40,100,220,.55)}.btn[data-k=b]{background:rgba(220,50,40,.55)}.btn[data-k=y]{background:rgba(230,180,20,.55)}
.sm{width:62px;height:30px;border-radius:15px;font-size:12px;background:rgba(80,80,80,.6)}
/* portrait: controls below game */
body.portrait #stickzone{left:0;top:0;width:52%;height:100%}
body.portrait .btn[data-k=y]{right:calc(4% + 74px);top:8%}body.portrait .btn[data-k=b]{right:4%;top:calc(8% + 40px)}
body.portrait .btn[data-k=x]{right:calc(4% + 148px);top:calc(8% + 40px)}body.portrait .btn[data-k=a]{right:calc(4% + 74px);top:calc(8% + 80px)}
body.portrait .sm[data-k=rb]{right:4%;bottom:8%}body.portrait .sm[data-k=start]{right:calc(4% + 76px);bottom:8%}body.portrait .sm[data-k=back]{left:4%;bottom:8%}
/* landscape: controls at the sides */
body.landscape #stickzone{left:0;top:20%;width:20%;height:80%}
body.landscape .btn[data-k=y]{right:76px;top:30%}body.landscape .btn[data-k=b]{right:8px;top:calc(30% + 38px)}
body.landscape .btn[data-k=x]{right:144px;top:calc(30% + 38px)}body.landscape .btn[data-k=a]{right:76px;top:calc(30% + 76px)}
body.landscape .sm[data-k=rb]{right:8px;top:8px}body.landscape .sm[data-k=start]{right:80px;top:8px}body.landscape .sm[data-k=back]{left:8px;top:8px}
body.landscape #touch .btn{transform-origin:center}
@media (max-height:420px){.btn{width:54px;height:54px}}
</style></head><body>
<canvas id="view" width="320" height="240" aria-label="Fatal Front game screen"></canvas>
<div id="touch"><div id="stickzone"><div id="stickbase"></div><div id="knob"></div></div>
<div class="btn" data-k="y">Y</div><div class="btn" data-k="x">X</div><div class="btn" data-k="b">B</div><div class="btn" data-k="a">A</div>
<div class="btn sm" data-k="rb">RB</div><div class="btn sm" data-k="start">PAUSE</div><div class="btn sm" data-k="back">BACK</div></div>
<script src="js/engine.js"></script><script src="js/sprites.js"></script><script src="js/anims.js"></script><script src="js/fight.js"></script><script src="js/run.js"></script><script src="js/main.js"></script>
</body></html>
