<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fatal Front</title><meta name="theme-color" content="#120404">
<meta name="description" content="Fatal Front — an original mid-90s arcade mash-up: run-and-gun stages that end in one-on-one fighting duels.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta property="og:title" content="Fatal Front"><meta property="og:image" content="icons/icon-512.png">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#view{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:2}
body.hastouch #touch{display:block}
#safe{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
html,body{overscroll-behavior:none;-webkit-touch-callout:none}
.tc{position:absolute;transform:translate(-50%,-50%);box-sizing:border-box;pointer-events:none}
.tc-stick .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:radial-gradient(circle,rgba(255,255,255,.05) 0 40%,rgba(255,255,255,.16) 41% 100%);box-shadow:0 0 0 2px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.4)}
.tc-stick .knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#ffb090,#d04020 60%,#701808);border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.6)}
.tc-stick span{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,100%);font:800 11px system-ui,sans-serif;letter-spacing:2px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
.tc-btn{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:system-ui,sans-serif;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),rgba(var(--c),1) 45%,rgba(0,0,0,.55) 120%);border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.7),0 3px 0 rgba(0,0,0,.5);text-shadow:0 1px 2px #000,0 0 2px #000;line-height:1}
.tc-btn b{font-size:1.9em;font-weight:900}.tc-btn i{font-style:normal;font-weight:800;font-size:.78em;letter-spacing:.5px;margin-top:2px}
.tc-sm{border-radius:30%}.tc-sm b{font-size:1.3em}.tc-sm i{font-size:1em}
.tc-btn.on{filter:brightness(1.7);transform:translate(-50%,-50%) scale(.92)}
body.tcedit .tc{outline:2px dashed rgba(255,255,255,.7);outline-offset:4px}body.tcedit .tc.sel{outline:3px solid #ffd040}
#tcpanel{display:none;position:fixed;z-index:5;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translateX(-50%);width:min(92vw,380px);max-height:calc(100% - 16px);overflow:auto;background:rgba(14,8,10,.94);border:2px solid #e0a040;border-radius:10px;color:#fff;font:14px system-ui,sans-serif;box-shadow:0 6px 30px #000;touch-action:pan-y}
#tcpanel.show{display:block}#tcpanel .hd{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#3a0c08;border-radius:8px 8px 0 0}#tcpanel .hd span{font-weight:900;letter-spacing:1px}#tcpanel .hd small{flex:1;opacity:.8}
#tcpanel.min .bd{display:none}#tcpanel .bd{padding:6px 12px 12px}#tcpanel .hint{margin:4px 0 8px;opacity:.8;font-size:12.5px}
#tcpanel .row{display:flex;align-items:center;gap:10px;margin:7px 0}#tcpanel label{width:118px}#tcpanel input[type=range]{flex:1;height:28px}#tcpanel output{width:48px;text-align:right}
#tcpanel input[type=checkbox]{width:22px;height:22px}
#tcpanel .sel{border-top:1px solid #553;margin-top:8px;padding-top:6px}#tcpanel .sel b{color:#ffd040}
#tcpanel button{font:700 14px system-ui,sans-serif;color:#fff;background:#333;border:1px solid #777;border-radius:6px;padding:9px 12px;min-height:40px}
#tcpanel .seg button.act{background:#c04020;border-color:#ffb080}#tcpanel .btns{justify-content:space-between}#tcpanel .pri{background:#2a8a3a;border-color:#8f8}
#tcpanel #tc-min{min-height:32px;padding:4px 10px}
</style></head><body>
<canvas id="view" width="320" height="240" aria-label="Fatal Front game screen"></canvas>
<div id="safe"></div><div id="touch"></div>
<script src="js/engine.js"></script><script src="js/sprites.js"></script><script src="js/anims.js"></script><script src="js/fight.js"></script><script src="js/run.js"></script><script src="js/touch.js"></script><script src="js/main.js"></script>
</body></html>
